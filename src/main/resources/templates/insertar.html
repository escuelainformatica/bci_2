<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Insertar alumno</title>
    <style>
        body   { font-family: Arial, sans-serif; margin: 30px; }
        form   { display: grid; gap: 10px; width: 320px; }
        label  { font-weight: bold; }
        button { padding: 6px 14px; width: fit-content; }
    </style>
</head>
<body>

    <!-- Formulario para agregar un nuevo alumno -->
    <form th:action="@{/insertar}" th:object="${alumno}" method="post">
        <div>
            <label for="id">id:</label>
            <input type="number" id="id" name="id" th:field="*{id}"/>
        </div>
        <div>
            <label for="nombre">nombre:</label>
            <input type="text" id="nombre" name="nombre" th:field="*{nombre}" maxlength="50"/>
        </div>
        <div>
            <label for="edad">edad:</label>
            <input type="number" id="edad" name="edad" th:field="*{edad}"/>
        </div>
        <button type="submit">Insertar</button>
    </form>

</body>
</html>
